name: Сборка сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE: https://api.fixkey.ru
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Публикация сборки
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cd dist
          git init -q
          git checkout -q -b dist
          git add -A
          git commit -q -m "Сборка $(date '+%d.%m.%Y %H:%M')"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
