<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Золотой градиент для ключа -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E5C2;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для блика -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Группа с тенью -->
  <g filter="url(#shadow)">
    <!-- Кольцо головки ключа -->
    <circle cx="180" cy="256" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="28"/>
    
    <!-- Домик внутри кольца -->
    <g fill="url(#goldGradient)">
      <!-- Крыша -->
      <polygon points="180,185 135,225 145,225 180,195 215,225 225,225"/>
      <!-- Основная часть дома -->
      <rect x="150" y="225" width="25" height="45"/>
      <rect x="185" y="225" width="25" height="45"/>
      <!-- Дверь -->
      <rect x="168" y="245" width="24" height="25" fill="#0A1628"/>
      <!-- Труба -->
      <rect x="205" y="205" width="12" height="25"/>
    </g>
    
    <!-- Стержень ключа -->
    <rect x="270" y="242" width="160" height="28" fill="url(#goldGradient)"/>
    
    <!-- Верхняя линия на стержне -->
    <rect x="270" y="238" width="160" height="6" fill="url(#goldGradient)"/>
    
    <!-- Зубцы ключа (снизу) -->
    <polygon points="310,270 330,290 350,270 370,290 390,270 410,290 430,270 430,275 310,275"/>
  </g>
  
  <!-- Блик на кольце (слева) -->
  <path d="M 115 200 A 70 70 0 0 1 120 310" fill="none" stroke="url(#shineGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Блик на стержне -->
  <rect x="280" y="244" width="100" height="4" fill="#FFFFFF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
